name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fix=' + JSON.stringify(item.fixAvailable))"
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run lint
      - name: Repository guardrail tests
        run: npm test
      - name: Build production bundle
        run: npm run build
